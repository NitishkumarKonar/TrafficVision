<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrafficVision</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

    <div class="container">

        <!-- Header -->

        <header>

            <h1>TrafficVision</h1>

            <p>
                AI-Powered Traffic Detection & Analytics
            </p>

        </header>


        <!-- Upload Section -->

        <section class="upload-section">

            <h2>Upload Traffic Video</h2>

            <form
                id="uploadForm"
                enctype="multipart/form-data"
            >

                <input
                    type="file"
                    id="videoFile"
                    name="file"
                    accept="video/*"
                    required
                >

                <button type="submit">
                    Upload Video
                </button>

            </form>

            <p id="uploadStatus"></p>

        </section>


        <!-- Dashboard -->

        <section class="dashboard">

            <h2>Traffic Overview</h2>

            <div class="cards">

                <div class="card">

                    <h3>Total Vehicles</h3>

                    <p id="totalVehicles">
                        0
                    </p>

                </div>


                <div class="card">

                    <h3>Incoming</h3>

                    <p id="incomingVehicles">
                        0
                    </p>

                </div>


                <div class="card">

                    <h3>Outgoing</h3>

                    <p id="outgoingVehicles">
                        0
                    </p>

                </div>

            </div>


            <!-- Vehicle Breakdown -->

            <div class="vehicle-section">

                <h2>Vehicle Breakdown</h2>

                <div class="vehicle-grid">

                    <div class="vehicle-card">

                        <h3>Cars</h3>

                        <p id="cars">
                            0
                        </p>

                    </div>


                    <div class="vehicle-card">

                        <h3>Motorcycles</h3>

                        <p id="motorcycles">
                            0
                        </p>

                    </div>


                    <div class="vehicle-card">

                        <h3>Buses</h3>

                        <p id="buses">
                            0
                        </p>

                    </div>


                    <div class="vehicle-card">

                        <h3>Trucks</h3>

                        <p id="trucks">
                            0
                        </p>

                    </div>

                </div>

            </div>

        </section>


        <!-- Video Result -->

        <section class="video-section">

            <h2>Processed Video</h2>

            <div class="video-container">

                <p id="videoPlaceholder">
                    Processed video will appear here.
                </p>

                <video
                    id="processedVideo"
                    controls
                    style="display: none; width: 100%;"
                ></video>

            </div>
        </section>

    </div>


    <script
        src="/static/js/script.js"
    ></script>

</body>

</html>
